.petal{position:fixed;top:0;left:0;width:16px;height:12px;background:radial-gradient(circle at 30% 30%,#fff 0,#ffc2d6 45%,#ff8fb4 100%);border-radius:80% 0 80% 0;pointer-events:none;z-index:1;opacity:.9;will-change:transform}
main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1.4rem 2rem 1rem;margin:1rem;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:32px;box-shadow:0 12px 36px var(--shadow);max-width:calc(100% - 2rem)}
h1{margin:0;font-size:1.2rem;color:var(--soft);font-weight:500}
#count{font-size:clamp(4.5rem,24vw,8.5rem);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--fg);max-width:100%;overflow-wrap:anywhere}
#count.bump{animation:bump .22s ease-out}
@keyframes bump{40%{transform:scale(1.12) rotate(-3deg)}}
#inc{font:inherit;font-weight:700;font-size:1.3rem;padding:1.05rem 2.4rem;border:0;border-radius:999px;color:#fff;background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:0 8px 0 rgba(176,52,100,.55),0 14px 24px var(--shadow);cursor:pointer;transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent}
#inc:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(176,52,100,.55),0 6px 12px var(--shadow)}
.btn2{font:inherit;color:var(--soft);background:none;border:0;padding:.5rem 1rem;cursor:pointer;font-size:1rem}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#gear{position:fixed;top:calc(env(safe-area-inset-top,0px) + .8rem);right:.8rem;z-index:5;width:46px;height:46px;border-radius:50%;border:0;background:var(--card);color:var(--fg);font-size:1.4rem;cursor:pointer;box-shadow:0 4px 12px var(--shadow)}
#panel{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 4rem);right:.8rem;left:.8rem;max-width:340px;margin-left:auto;background:var(--card);color:var(--fg);border-radius:22px;padding:1.2rem;box-shadow:0 12px 32px var(--shadow);text-align:left;display:none}
#panel.open{display:block}
#panel h2{margin:0 0 1rem;font-size:1.1rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:1rem}
.row:last-child{margin-bottom:0}
.hint{font-size:.8rem;color:var(--soft);margin:-.6rem 0 1rem}
.step{display:flex;align-items:center;gap:.4rem}
.step button{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:1.2rem;cursor:pointer}
.num{width:5.5rem;text-align:center;font:inherit;font-weight:700;font-size:1.1rem;padding:.45rem;border-radius:12px;border:2px solid var(--accent2);background:transparent;color:var(--fg)}
.seg{display:flex;border-radius:999px;background:rgba(240,108,155,.18);padding:3px}
.seg button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:.45rem .9rem;background:none;color:var(--soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--soft);opacity:.5;transition:.2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--accent);opacity:1}
.sw input:checked+span::after{transform:translateX(22px)}
.sw input:focus-visible+span{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){#count.bump{animation:none}}
</style>
</head>
<body>
<button id="gear" aria-label="Настройки" aria-expanded="false">⚙</button>
<section id="panel" aria-label="Настройки">
  <h2>Настройки 🌸</h2>
  <div class="row"><label for="startInput">Начальное число</label>
    <input id="startInput" class="num" type="number" inputmode="numeric" value="0"></div>
  <p class="hint">При смене числа счёт начнётся с него, и «Сбросить» вернёт к нему.</p>
  <div class="row"><span id="modeLbl">Что делает клик</span>
    <div class="seg" role="group" aria-labelledby="modeLbl"><button id="mAdd" aria-pressed="true">Прибавляет</button><button id="mSub" aria-pressed="false">Отнимает</button></div></div>
  <div class="row"><label for="stepInput">На сколько за клик</label>
    <div class="step"><button id="minus" aria-label="Меньше">−</button><input id="stepInput" class="num" type="number" inputmode="numeric" min="1" max="1000000" value="1"><button id="plus" aria-label="Больше">+</button></div></div>
  <div class="row"><label for="snd">Звук</label><span class="sw"><input id="snd" type="checkbox" checked><span></span></span></div>
</section>
<main>
  <h1>🌸 Лови лепестки 🌸</h1>
  <div id="count" aria-live="polite">0</div>
  <button id="inc">Нажми меня</button>
  <button id="reset" class="btn2">Сбросить</button>
</main>
<script>
var start=0,n=0,step=1,mode='add',soundOn=true;
var $=function(i){return document.getElementById(i)};
var countEl=$('count'),startInput=$('startInput'),stepInput=$('stepInput'),snd=$('snd'),panel=$('panel'),gear=$('gear'),incBtn=$('inc');
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var LIM=1000000000;

function load(){try{var s=JSON.parse(localStorage.getItem('sakura2')||'null');if(s){start=+s.start||0;n=isFinite(+s.n)?+s.n:start;step=Math.max(1,+s.step||1);mode=s.mode==='sub'?'sub':'add';soundOn=s.sound!==false}}catch(e){}}
function save(){try{localStorage.setItem('sakura2',JSON.stringify({start:start,n:n,step:step,mode:mode,sound:soundOn}))}catch(e){}}
load();
function render(){
  countEl.textContent=n.toLocaleString('ru-RU');
  startInput.value=start;stepInput.value=step;snd.checked=soundOn;
  $('mAdd').setAttribute('aria-pressed',mode==='add');$('mSub').setAttribute('aria-pressed',mode==='sub');
  incBtn.textContent='Нажми меня '+(mode==='add'?'+':'−')+step.toLocaleString('ru-RU');
}
render();

var ctx=null;
function pop(){
  if(!soundOn)return;
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
    var t=ctx.currentTime,base=(mode==='add'?660:520)+Math.random()*160,dir=mode==='add'?1.25:.8;
    [1,1.5].forEach(function(m,i){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.setValueAtTime(base*m,t);o.frequency.exponentialRampToValueAtTime(base*m*dir,t+.12);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(i?.07:.14,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.28);
      o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.3);
    });
  }catch(e){}
}

function petal(x,y,burst){
  var p=document.createElement('div');p.className='petal';document.body.appendChild(p);
  var s=.7+Math.random()*.9,dx=burst?(Math.random()-.5)*220:(Math.random()-.5)*160,
      rise=burst?-(40+Math.random()*80):0,fall=burst?innerHeight-y+30:innerHeight+40,
      rot=(Math.random()<.5?-1:1)*(180+Math.random()*360),dur=burst?1600+Math.random()*900:7000+Math.random()*5000;
  var a=p.animate([
    {transform:'translate('+x+'px,'+y+'px) rotate(0) scale('+s+')',opacity:1},
    {transform:'translate('+(x+dx*.4)+'px,'+(y+rise)+'px) rotate('+rot*.4+'deg) scale('+s+')',opacity:1,offset:burst?.25:.5},
    {transform:'translate('+(x+dx)+'px,'+(y+fall)+'px) rotate('+rot+'deg) scale('+s+')',opacity:.2}
  ],{duration:dur,easing:'ease-in-out'});
  a.onfinish=function(){p.remove()};
}
if(!reduce){setInterval(function(){if(!document.hidden)petal(Math.random()*innerWidth,-20,false)},1400)}

incBtn.addEventListener('click',function(){
  n+=mode==='add'?step:-step;
  if(n>LIM)n=LIM;if(n<-LIM)n=-LIM;
  render();save();pop();
  countEl.classList.remove('bump');void countEl.offsetWidth;countEl.classList.add('bump');
  if(!reduce){var r=incBtn.getBoundingClientRect();for(var i=0;i<7;i++)petal(r.left+r.width/2,r.top+r.height/2,true)}
});
$('reset').addEventListener('click',function(){n=start;render();save()});

gear.addEventListener('click',function(){var o=panel.classList.toggle('open');gear.setAttribute('aria-expanded',o)});
function setStart(v){v=Math.round(+v);if(!isFinite(v))v=0;start=Math.max(-LIM,Math.min(LIM,v));n=start;render();save()}
function setStep(v){v=Math.round(+v);if(!isFinite(v)||v<1)v=1;if(v>1000000)v=1000000;step=v;render();save()}
startInput.addEventListener('change',function(){setStart(startInput.value)});
$('minus').addEventListener('click',function(){setStep(step-1)});
$('plus').addEventListener('click',function(){setStep(step+1)});
stepInput.addEventListener('change',function(){setStep(stepInput.value)});
$('mAdd').addEventListener('click',function(){mode='add';render();save()});
$('mSub').addEventListener('click',function(){mode='sub';render();save()});
snd.addEventListener('change',function(){soundOn=snd.checked;save();if(soundOn)pop()});
</script>
</body>
</html>
